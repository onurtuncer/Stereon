#
# Blocking CI on the reference compiler, GCC 16 (ADR-0016), plus the
# REUSE licence check (ADR-0008). Job names are stable: branch protection
# refers to them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  linux:
    name: Linux GCC 16 (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    container:
      image: gcc:16.2
      # LeakSanitizer needs ptrace.
      options: --cap-add SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc16-debug, gcc16-release, gcc16-asan]
    steps:
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build
          g++ --version | head -1; cmake --version | head -1; ninja --version
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux-tsan:
    name: Linux GCC 16 (gcc16-tsan)
    runs-on: ubuntu-24.04
    steps:
      # ThreadSanitizer fails on kernels with high mmap randomisation. It is
      # a host setting, so this job runs the GCC container by hand.
      - name: Lower mmap randomisation for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/checkout@v4
      - name: Configure, build and test in gcc:16.2
        run: |
          docker run --rm -v "$PWD:/src" -w /src gcc:16.2 bash -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends cmake ninja-build
            git config --global --add safe.directory /src
            cmake --preset gcc16-tsan -DSTEREON_WARNINGS_AS_ERRORS=ON
            cmake --build --preset gcc16-tsan
            ctest --preset gcc16-tsan'

  windows:
    name: Windows GCC 16 (MSYS2 UCRT64, ${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc16-debug, gcc16-windows]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: g++ --version | head -1; cmake --version | head -1; ninja --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  macos:
    name: macOS GCC 16 (gcc16-debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 16 and Ninja
        run: |
          brew install gcc@16 ninja
          g++-16 --version | head -1; cmake --version | head -1
      - name: Configure
        run: cmake --preset gcc16-debug -DCMAKE_CXX_COMPILER=g++-16 -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset gcc16-debug
      - name: Test
        run: ctest --preset gcc16-debug

  # Coverage: gcovr turns the gcov data into Cobertura XML and Codecov
  # reports it, including the pull request comment (codecov.yml). Informational,
  # not a required check. Needs the CODECOV_TOKEN repository secret.
  coverage:
    name: Coverage (gcc16-coverage)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    steps:
      - name: Install CMake, Ninja and gcovr
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build python3-venv
          python3 -m venv /opt/gcovr
          /opt/gcovr/bin/pip install -q gcovr
          echo "/opt/gcovr/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Trust the workspace for git (Codecov reads the commit from it)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: cmake --preset gcc16-coverage
      - name: Build
        run: cmake --build --preset gcc16-coverage
      - name: Test
        run: ctest --preset gcc16-coverage
      - name: Collect coverage
        run: |
          gcovr --version | head -1
          gcovr --root . --filter 'src/' --gcov-executable gcov             --exclude-unreachable-branches --exclude-throw-branches             --cobertura coverage.xml --print-summary             build/gcc16-coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: gcc16
          disable_search: true
          fail_ci_if_error: false

  # Non-blocking: Clang and MSVC are reported until they support C++26
  # reflection and contracts (ADR-0016). Failures show on the run but do not
  # fail it, and these jobs are not required checks in branch protection.
  clang:
    name: Linux Clang latest (clang-debug, non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable LLVM (Clang, libc++, clang-scan-deps)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          LLVM=$(grep -oP '^CURRENT_LLVM_STABLE=\K[0-9]+' llvm.sh)
          sudo bash llvm.sh "$LLVM" all
          sudo apt-get install -y -qq ninja-build
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1; cmake --version | head -1
      - name: Configure
        run: |
          cmake --preset clang-debug \
            -DCMAKE_CXX_COMPILER=clang++-$LLVM \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-$LLVM
      - name: Build
        run: cmake --build --preset clang-debug
      - name: Test
        run: ctest --preset clang-debug

  msvc:
    name: Windows MSVC latest (msvc-debug, non-blocking)
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Toolchain versions
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
      - name: Configure
        run: cmake --preset msvc-debug
      - name: Build
        run: cmake --build --preset msvc-debug
      - name: Test
        run: ctest --preset msvc-debug

  reuse:
    name: REUSE licence check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: reuse lint
        run: pipx run reuse lint
