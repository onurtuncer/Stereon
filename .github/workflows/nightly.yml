#
# The nightly run (TODO.md, section 3; ADR-0007): the full test suite on the
# debug, release and observe presets, the fuzz targets at length under the
# sanitizers, and the determinism check across processes.
#
# Observe (ADR-0016): contracts evaluated with the observe semantic, so a
# violation is reported and the run continues; the fuzz targets count the
# violations their inputs cause and fail when there is one, which is the
# observe-mode corpus run the ADR asks for before every release.
#
# Determinism (ADR-0007, G1): for the same executable, hardware and Context
# settings, results are bit-identical for any thread count and scheduler.
# The operations that run in parallel today, batch projection onto B-spline
# curves and surfaces and the Booleans' union, cut and common
# (tests/support/BooleanCases.hpp), are run on the serial scheduler and at
# 1, 2, 8 and 32 threads, each in its own process and twice, and the files
# they write are compared byte for byte. Every pull request runs the same comparison within
# one process on fewer points (CTest, "determinism:" and "[determinism]").

name: Nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      points:
        description: Points projected per configuration
        type: number
        default: 200000

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  suite:
    name: Full test suite (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    container: gcc:16.2
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc16-debug, gcc16-release, gcc16-observe]
    steps:
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build gdb lldb python3
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    # The fuzz targets of tests/fuzz/ at length, under AddressSanitizer and
    # UBSan: every input must give a KernelError, never a crash or a
    # contract violation (ADR-0006). Findings are uploaded for reproduction.
    name: Fuzz targets, 200000 mutations each (gcc16-asan)
    runs-on: ubuntu-24.04
    container:
      image: gcc:16.2
      options: --cap-add SYS_PTRACE
    timeout-minutes: 120
    steps:
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build python3
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset gcc16-asan -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build the fuzz targets
        run: cmake --build --preset gcc16-asan --target stereon_fuzz_StnReadFuzz stereon_fuzz_BSplineFuzz
      - name: Run them
        run: |
          mkdir -p findings && cd findings
          seed=$(date +%Y%m%d)
          echo "seed $seed (rerun with --seed $seed to reproduce)"
          ../build/gcc16-asan/tests/stereon_fuzz_StnReadFuzz --runs 200000 --seed "$seed" ../tests/io/data
          ../build/gcc16-asan/tests/stereon_fuzz_BSplineFuzz --runs 200000 --seed "$seed"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: findings/

  determinism:
    name: Determinism, serial and 1, 2, 8, 32 threads (gcc16-release)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    timeout-minutes: 90
    steps:
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset gcc16-release -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build the determinism check
        run: cmake --build --preset gcc16-release --target stereon_determinism
      - name: Run every configuration twice, each in its own process
        env:
          POINTS: ${{ inputs.points || 200000 }}
        run: |
          mkdir -p build/determinism
          for run in 1 2; do
            for config in serial 1 2 8 32; do
              ./build/gcc16-release/tests/stereon_determinism "$config" \
                "build/determinism/$config-$run.bin" "$POINTS"
            done
          done
      - name: Compare the bytes
        env:
          POINTS: ${{ inputs.points || 200000 }}
        run: |
          cd build/determinism
          {
            echo "## Determinism (ADR-0007, G1)"
            echo
            echo "Batch projection of $POINTS points onto a rational cubic curve and a rational bicubic surface, and the Booleans of tests/support/BooleanCases.hpp; each configuration in its own process, twice."
            echo
            echo "| Configuration | Run | SHA-256 |"
            echo "| --- | --- | --- |"
            for file in *.bin; do
              name="${file%.bin}"
              echo "| ${name%-*} | ${name##*-} | \`$(sha256sum "$file" | cut -c1-64)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.bin
          distinct=$(sha256sum *.bin | cut -c1-64 | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "Results differ between configurations or runs ($distinct distinct)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Every configuration and run wrote the same bytes." | tee -a "$GITHUB_STEP_SUMMARY"
