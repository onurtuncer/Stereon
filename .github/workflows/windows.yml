#
# Blocking CI on the reference compiler, GCC 16 (ADR-0016), on Windows
# through MSYS2 UCRT64. Job names are stable: branch protection refers to them.

name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  windows:
    name: Windows GCC 16 (MSYS2 UCRT64, ${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc16-debug, gcc16-windows]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: g++ --version | head -1; cmake --version | head -1; ninja --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
