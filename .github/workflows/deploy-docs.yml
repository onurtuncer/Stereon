#
# Builds the Sphinx manual (docs/) with the Doxygen API reference and deploys
# it to GitHub Pages from main. Pull requests that touch the docs only build
# it, so a broken page shows up before merge. The repository's Pages source
# must be set to "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'assets/stereon_logo.png'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A running deployment is never cancelled
# half-way; a newer push waits and then deploys the latest commit.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          sphinx-build --version

      - name: Check for TikZ figures
        id: tikz
        run: |
          if compgen -G "docs/tikz/*.tex" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No TikZ figures in docs/tikz; skipping LaTeX."
          fi

      # Ubuntu 24.04 packages Doxygen 1.9.8, whose XML for C++20 module units
      # is malformed ("mismatched tag" in index.xml), so Breathe rendered no
      # API at all. A pinned release binary from doxygen/doxygen instead.
      - name: Install Doxygen and Graphviz
        env:
          DOXYGEN_VERSION: 1.17.0
          DOXYGEN_SHA256: 75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends graphviz
          tag="Release_${DOXYGEN_VERSION//./_}"
          curl -sSL -o doxygen.tar.gz             "https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum -c -
          tar -xzf doxygen.tar.gz "doxygen-${DOXYGEN_VERSION}/bin/doxygen"
          sudo install -m 755 "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          rm -rf doxygen.tar.gz "doxygen-${DOXYGEN_VERSION}"
          doxygen --version

      - name: Install LaTeX
        if: steps.tikz.outputs.present == 'true'
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils

      # Figures land in docs/_static/tikz/<name>.png; reference them from a
      # page with ".. image:: _static/tikz/<name>.png".
      - name: Build TikZ figures to PNG
        if: steps.tikz.outputs.present == 'true'
        run: |
          mkdir -p build/tikz docs/_static/tikz
          for tex in docs/tikz/*.tex; do
            fig=$(basename "$tex" .tex)
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory build/tikz "$tex"
            pdftoppm -r 200 -png -singlefile "build/tikz/$fig.pdf" "docs/_static/tikz/$fig"
          done

      # conf.py configures docs/Doxyfile.in and runs Doxygen itself when
      # STEREON_RUN_DOXYGEN=1, writing XML to docs/_build/doxygen/xml.
      - name: Build Sphinx HTML
        env:
          STEREON_RUN_DOXYGEN: "1"
        run: |
          sphinx-build -T --keep-going -b html docs build/html 2>&1 | tee build/sphinx.log
          test -f docs/_build/doxygen/xml/index.xml
          # Breathe reports an XML it cannot read as a warning and leaves the
          # API page empty; the manual is not built until the page has content.
          if grep -q "Unable to parse xml" build/sphinx.log; then
            echo "::error::Breathe could not read the Doxygen XML"; exit 1
          fi
          grep -q "PagedArena" build/html/api.html
          echo "Pages built: $(find build/html -name '*.html' | wc -l)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
