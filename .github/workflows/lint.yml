#
# Source checks: the REUSE licence check (ADR-0008), formatting, library
# layering, the epsilon ban in topo/, boolean/ and mesh/ (ADR-0001,
# ADR-0002), function complexity (ADR-0022) and magic numbers (ADR-0024). clang-format is pinned so every contributor formats the same way.
# Job names are stable: branch protection refers to them.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  reuse:
    name: REUSE licence check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: reuse lint
        run: pipx run reuse lint

  lint:
    name: Lint (format, layering, epsilon)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install the source-check tools (clang-format, lizard)
        run: pip install -r tools/requirements.txt
      - name: clang-format
        run: |
          clang-format --version
          git ls-files -z -- '*.cpp' '*.cppm' '*.hpp' '*.h' | xargs -0 clang-format --dry-run --Werror
      - name: Library layering
        run: python tools/check_layering.py
      - name: Epsilon ban (self-test, then src/)
        run: |
          python tools/check_epsilon.py --self-test
          python tools/check_epsilon.py
      - name: Magic numbers (self-test, then the tree; ADR-0024)
        run: |
          python tools/check_literals.py --self-test
          python tools/check_literals.py
      - name: Function complexity limits (self-test, then the tree; ADR-0022)
        run: |
          python tools/check_complexity.py --self-test
          python tools/check_complexity.py
      - name: Dependency licences (self-test, then the declarations; ADR-0008)
        run: |
          python tools/check_dependencies.py --self-test
          python tools/check_dependencies.py
      - name: Corpus cases and nominal ground truth (self-test, then corpus/)
        run: |
          python tools/check_corpus.py --self-test
          python tools/check_corpus.py
