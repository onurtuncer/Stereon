#
# Builds the Python bindings with GCC 16 and imports the module. Not a
# required check until it is added to branch protection.

name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  python:
    name: Python bindings (GCC 16, gcc16-debug)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    steps:
      - name: Install CMake, Ninja and Python headers
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build python3-dev
          python3 --version
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset gcc16-debug -DSTEREON_BUILD_PYTHON=ON -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset gcc16-debug
      - name: Test (includes importing the module)
        run: ctest --preset gcc16-debug
