#
# Builds the benchmarks and smoke-runs them. Not a required check until it
# is added to branch protection.

name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  bench:
    name: Benchmarks build (bench)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    steps:
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset bench -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset bench
      - name: Smoke run
        run: ./build/bench/bench/stereon_bench --benchmark_min_time=0.01s
