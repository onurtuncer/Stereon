#
# The reference run of the OpenCASCADE comparison benchmarks (docs/benchmarks.md,
# B0.2–B0.5 and B1.1–B1.6): stereon_occt_bench on the reference image, the gcc:16.2 container
# on a GitHub-hosted ubuntu-24.04 runner, against the pinned OCCT that occt.yml
# builds and caches. Development runs happen on whatever machine is to hand;
# the report a release gate cites comes from here (docs/performance.rst, Method).
#
# Each run uploads an artifact with the raw Google Benchmark JSON, the machine
# and build record and the rendered report (tools/bench_report.py). A release
# commits that report to bench/reports/. The run also appears in the job summary.
#
# Hosted runners differ from run to run (the CPU model is recorded) and share
# their host, so every row is the median of interleaved repetitions and the
# report shows the spread. A row whose spread is large is re-run, not quoted.
# The topology rows build a 10^6-face sheet per repetition, seconds to
# minutes each, so they run in a second invocation with fewer repetitions;
# the report reads both files as one run. The curve dispatch rows (B0.2) make
# 10^8 evaluations per repetition, a second or so each, and run with B1.
# Not a required check: timings cannot gate a merge on a shared runner.

name: OCCT reference run

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - bench/occt/**
      - bench/TopoBench.cpp
      - bench/BooleanBench.cpp
      - bench/Memory.*
      - bench/CMakeLists.txt
      - tools/bench_report.py
      - tools/occt/build_occt.sh
      - .github/workflows/occt-reference.yml
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions per curve and surface benchmark (the median is reported)
        type: number
        default: 15
      filter:
        description: Google Benchmark regex of the curve and surface benchmarks (empty for B0.2 and B1)
        type: string
        default: ""
      topology_repetitions:
        description: Repetitions per topology benchmark (B0.3–B0.5, ADR-0004, ADR-0005)
        type: number
        default: 5
      topology_filter:
        description: Google Benchmark regex of the topology benchmarks (empty for all of them)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  OCCT_PREFIX: /opt/occt

jobs:
  reference:
    name: OCCT reference run (B0.2–B0.5, B1.1–B1.6)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    timeout-minutes: 240
    steps:
      - name: Install CMake, Ninja and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build zstd python3
          g++ --version | head -1; cmake --version | head -1; ninja --version
      - uses: actions/checkout@v7
      - name: Restore the OCCT build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OCCT_PREFIX }}
          key: occt-gcc16.2-${{ hashFiles('tools/occt/build_occt.sh') }}
      - name: Build OCCT (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/occt/build_occt.sh "$OCCT_PREFIX" "$RUNNER_TEMP/occt"
      - name: Save the OCCT build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OCCT_PREFIX }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Show the OCCT build
        run: cat "$OCCT_PREFIX/stereon-occt-build.txt"
      - name: Configure the benchmarks against OCCT
        run: >
          cmake --preset bench -DSTEREON_WARNINGS_AS_ERRORS=ON
          -DSTEREON_WITH_OCCT=ON -DCMAKE_PREFIX_PATH="$OCCT_PREFIX"
      - name: Build
        run: cmake --build --preset bench --target stereon_occt_bench stereon_bench
      # The run's files go under the workspace: the upload step executes in
      # the container, and GitHub maps the host path of ${{ runner.temp }}
      # into it for the first line of a multi-line input only, so an upload
      # from $RUNNER_TEMP found one file of three.
      - name: Record the machine and the builds
        run: |
          mkdir -p build/reference
          {
            echo "date=$(date -u +%Y-%m-%d)"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref_name }}"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "runner=GitHub Actions ubuntu-24.04 (${{ runner.os }}, ${{ runner.arch }}), container gcc:16.2"
            echo "cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)"
            echo "cpus=$(nproc)"
            echo "topology=$(lscpu 2>/dev/null | sed -n 's/^Thread(s) per core:[[:space:]]*/threads per core /p; s/^Core(s) per socket:[[:space:]]*/cores per socket /p; s/^Socket(s):[[:space:]]*/sockets /p' | paste -sd ',' -)"
            echo "memory=$(awk '/MemTotal/ {printf "%.1f GB", $2 / 1048576}' /proc/meminfo)"
            echo "kernel=$(uname -sr)"
            echo "compiler=$(g++ --version | head -1)"
            echo "memory_measure=live heap, glibc mallinfo2 (bench/Memory.hpp)"
            sed 's/^/occt_/' "$OCCT_PREFIX/stereon-occt-build.txt"
          } | tee build/reference/machine.txt
      - name: Run the curve and surface benchmarks (B0.2, B1)
        env:
          REPETITIONS: ${{ inputs.repetitions || 15 }}
          FILTER: ${{ inputs.filter }}
        run: >
          ./build/bench/bench/stereon_occt_bench
          --benchmark_repetitions="$REPETITIONS"
          --benchmark_enable_random_interleaving=true
          --benchmark_display_aggregates_only=true
          --benchmark_filter="${FILTER:-^(B0\.2|B1\.)}"
          --benchmark_out=build/reference/results.json --benchmark_out_format=json
      - name: Run the topology benchmarks (B0.3–B0.5, ADR-0004, ADR-0005)
        env:
          REPETITIONS: ${{ inputs.topology_repetitions || 5 }}
          FILTER: ${{ inputs.topology_filter }}
        run: >
          ./build/bench/bench/stereon_occt_bench
          --benchmark_repetitions="$REPETITIONS"
          --benchmark_enable_random_interleaving=true
          --benchmark_display_aggregates_only=true
          --benchmark_filter="${FILTER:-^(B0\.[345]|ADR-)}"
          --benchmark_out=build/reference/results-topology.json --benchmark_out_format=json
      # ADR-0007's speed-up: the drilled slab's cut (over 1 000 faces) on the
      # serial scheduler and on the runner's 4 threads, interleaved, the ratio
      # of the medians reported against half the control's, as the ADR asks, beside the
      # control (batch projection, parallel through and through), whose ratio
      # is what the runner's 4 threads give any work.
      - name: Run the Boolean speed-up (M10, ADR-0007)
        env:
          REPETITIONS: ${{ inputs.topology_repetitions || 5 }}
        run: |
          ./build/bench/bench/stereon_bench \
            --benchmark_repetitions="$REPETITIONS" \
            --benchmark_enable_random_interleaving=true \
            --benchmark_display_aggregates_only=true \
            --benchmark_filter='^M10/' \
            --benchmark_out=build/reference/results-speedup.json --benchmark_out_format=json
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          rows = json.load(open("build/reference/results-speedup.json"))["benchmarks"]
          machine = dict(line.split("=", 1) for line in open("build/reference/machine.txt").read().splitlines() if "=" in line)
          # Run names carry Google Benchmark's suffixes ("/iterations:1/real_time"):
          # each row is found by its benchmark and scheduler.
          def find(aggregate, bench, scheduler):
              return next(r for r in rows if r.get("aggregate_name") == aggregate
                          and r["run_name"].startswith(f"M10/{bench}/{scheduler}"))
          print("## Boolean speed-up (ADR-0007)\n")
          print("The slab drilled with 20 x 20 holes (1 206 faces in the operands), cut; and the control, batch projection of 200 000 points, parallel through and through. Medians of interleaved repetitions.\n")
          print(f"Runner: {machine.get('cpu', '?')}, {machine.get('cpus', '?')} CPUs ({machine.get('topology', 'topology not recorded')}).\n")
          print("| Benchmark | Serial | 4 threads | Speed-up | CV serial, 4 threads |")
          print("| --- | --- | --- | --- | --- |")
          ratios = {}
          for bench in ("DrilledSlabCut", "Control"):
              median = {s: find("median", bench, s)["real_time"] for s in ("serial", "threads:4")}
              spread = {s: find("cv", bench, s)["real_time"] for s in ("serial", "threads:4")}
              ratios[bench] = median["serial"] / median["threads:4"]
              print(f"| {bench} | {median['serial']:.0f} ms | {median['threads:4']:.0f} ms | {ratios[bench]:.2f}x "
                    f"| {100 * spread['serial']:.1f} %, {100 * spread['threads:4']:.1f} % |")
          ratio = ratios["DrilledSlabCut"]
          share = ratio / ratios["Control"]
          print(f"\nSpeed-up on 4 threads: **{ratio:.2f}x**, {100 * share:.0f} % of the control's {ratios['Control']:.2f}x, "
                f"what the runner's 4 threads give work with no serial part. ADR-0007 asks for at least 50 %: {'met' if share >= 0.5 else 'NOT met'}.")
          EOF
      - name: Render the report
        run: |
          python3 tools/bench_report.py build/reference/results.json build/reference/results-topology.json \
            --title "Benchmark reference run — dispatch (B0.2), topology (B0.3–B0.5), curves and surfaces (B1.1–B1.6)" \
            --machine build/reference/machine.txt --out build/reference/report.md
          cat build/reference/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the run
        uses: actions/upload-artifact@v4
        with:
          name: occt-reference-run-${{ github.sha }}
          path: build/reference/
          retention-days: 90
          if-no-files-found: error
