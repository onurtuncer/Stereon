#
# Mutation testing (ADR-0032, accepted 2026-10-17): the catalogue on the
# reference compiler, weekly (Mondays 03:17 UTC) as the ADR requires, and on
# request. Off the pull-request path and not a
# required check: ADR-0032 starts with non-blocking reports. The job fails
# when the baseline fails or a critical seeded fault is not detected with
# its declared diagnostic, so a regression in fault detection is visible.
# The harness works in a disposable git worktree; no mutant leaves the job.

name: Mutation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  pilot:
    name: Mutation pilot (gcc16-debug)
    runs-on: ubuntu-24.04
    container: gcc:16.2
    timeout-minutes: 300
    steps:
      - name: Install CMake, Ninja and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build python3 git
          g++ --version | head -1; cmake --version | head -1
      - uses: actions/checkout@v7
      - name: Run the pilot catalogue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/mutate.py --catalogue tools/mutation/pilot.json --work build/mutation
      - name: Publish the report
        if: always()
        run: cat build/mutation/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            build/mutation/report.md
            build/mutation/report.json
