# Explicit full-scale qualification for issue #160. The 20x20 overlapping
# grids are intentionally hidden from regular CTest for bounded routine CI.
name: Boolean issue 160 large grids

on:
  pull_request:
    paths:
      - '.github/workflows/issue160-large.yml'
      - 'src/boolean/**'
      - 'tests/boolean/SpeedupTests.cpp'
      - 'tests/support/BooleanCases.hpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  large-grids:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'fix/issue160-')
    name: GCC 16 release, original grid overlap (20x20)
    runs-on: ubuntu-24.04
    container:
      image: gcc:16.2
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v7
      - name: Install CMake and Ninja
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build
      - name: Configure
        run: cmake --preset gcc16-release -DSTEREON_WARNINGS_AS_ERRORS=ON
      - name: Build Boolean tests
        run: cmake --build --preset gcc16-release --target stereon_boolean_tests
      - name: Run original large-grid regression
        run: ./build/gcc16-release/tests/stereon_boolean_tests '[issue160][large]' --durations yes
