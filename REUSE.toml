#
# Licensing for files that cannot carry a header comment (ADR-0008).
# Source files carry their own SPDX header; see docs/license-header.txt.
# Corpus files keep their original licences, recorded in corpus/LICENSES.md.

version = 1

[[annotations]]
path = [
    "*.md", "**/*.md",
    "*.json", "**/*.json",
    "**/*.png",
    "**/*.svg",
    "**/*.stn",
    "docs/license-header.txt",
    # Compiler bug testcases: a header would shift the quoted line numbers.
    "docs/toolchain/gcc-bugs/**",
    ".github/**",
    ".gitignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Onur Tuncer and Stereon contributors"
SPDX-License-Identifier = "MPL-2.0"
