#
# Codecov settings. Coverage is reported on every pull request but never
# blocks a merge: both statuses are informational.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "70...95"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "build/**"
